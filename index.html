<style>
:root{--bg:#0a0f1e;--panel:#10172b;--card:#161f38;--line:#24304f;--text:#e9eefb;--muted:#9aa6c4;--c:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{padding:16px 18px 10px;background:linear-gradient(180deg,#121214,#0a0b10);box-shadow:inset 0 4px 0 #f2f2f2;border-bottom:1px solid #26262c;flex:none}
.tabrow{display:flex;align-items:center;gap:10px;margin-top:10px}.tabrow .tabs{margin-top:0;flex:1;min-width:0}
.who{flex:none;border:1px dashed #44444f;background:transparent;color:#cfd3e0;border-radius:999px;padding:6px 12px;font:700 12px 'Archivo',sans-serif;font-stretch:85%;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.who b{color:#f7c600}
.who:hover{border-color:#f7c600}
#picker{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#1a1f3aee,#05070ff5);display:none;align-items:center;justify-content:center;padding:20px}
#picker.on{display:flex}
.pbox{text-align:center;max-width:620px;width:100%}
.ptitle{font:400 30px 'Bungee',sans-serif;color:#fff;margin-bottom:6px}
.pbox p{color:#9aa6c4;margin:0 0 24px;font-size:15px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pcard{background:#121827;border:2px solid #2a3350;border-radius:20px;padding:26px 16px;cursor:pointer;color:#fff;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Archivo',sans-serif}
.pcard:hover{border-color:#f7c600;transform:translateY(-4px);box-shadow:0 18px 40px -12px #f7c60055}
.pcard span{font-size:64px;line-height:1}
.pcard b{font:400 24px 'Bungee',sans-serif}
.pcard small{color:#9aa6c4;font-size:13px}
@media (max-width:520px){.pcards{grid-template-columns:1fr;gap:26px}.pcard span{font-size:44px}}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{position:relative;margin-left:auto;width:min(340px,100%);z-index:20}
.search input{width:100%;background:#1a1a20;border:1px solid #33333d;color:#fff;border-radius:999px;padding:9px 14px;font:600 14px 'Archivo',sans-serif;font-stretch:90%;outline:none;transition:.2s}
.search input:focus{border-color:#f7c600;box-shadow:0 0 0 3px #f7c60033}
.res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#121217;border:1px solid #33333d;border-radius:14px;overflow:hidden;display:none;box-shadow:0 18px 40px #000a;max-height:60vh;overflow-y:auto}
.res.on{display:block}
.res a{display:flex;align-items:center;gap:10px;padding:9px 12px;color:#fff;text-decoration:none;cursor:pointer;border-bottom:1px solid #222228}
.res a:hover,.res a.sel{background:#1f1f27}
.res a .bullet{flex:none}
.res a small{display:block;color:#9aa0b4;font-size:12px;font-weight:500}

/* ================= FRESH THEME (inspirado en fraiche.io) ================= */
:root{--bg:#FEFFEB;--panel:#FEFFEB;--card:#FFF6D6;--line:#E7E4C0;--text:#2E3120;--muted:#6E705A;
 --mustard:#FFCE36;--teal:#006D64;--forest:#152826;--mint:#DBFFFB;--coral:#FF6E61;--olive:#393D29;--brown:#413306;--cream2:#F6F8DE;
 --disp:'Calistoga',Georgia,serif;--body:'Outfit',system-ui,sans-serif;--hand:'Gochi Hand',cursive}
html,body{background:var(--bg);color:var(--text);font-family:var(--body)}
header{background:var(--bg);box-shadow:none;border-bottom:1.5px solid var(--line)}
.brand h1{font-family:var(--disp);font-size:24px;color:var(--brown);letter-spacing:0}
.brand h1 span{font-family:var(--disp);color:var(--forest);background:var(--mustard);padding:2px 10px 3px;border-radius:6px;display:inline-block;transform:rotate(-2deg);margin-right:4px;transition:transform .3s}
.brand h1:hover span{transform:rotate(2deg) scale(1.04)}
.brand small{font-family:var(--hand);font-size:17px;color:var(--teal);letter-spacing:0;text-transform:none;font-weight:400;font-stretch:100%}
.search input{background:#fff;border:1.5px solid var(--line);color:var(--text);font:500 14px var(--body)}
.search input::placeholder{color:#9a9c84}

    let v=0;altiTimer=setInterval(()=>{v=Math.min(1000,v+20);const e=document.getElementById('altv');if(e)e.textContent=v.toLocaleString('es-AR')+' ft';if(v>=1000){clearInterval(altiTimer);const a=fxEl.querySelector('.alti');if(a)a.firstChild.textContent='🏙️ Llegaste';}},45);

function setNow(s){setFX(s.fx||null);const u=photoUrl(s.n);nowEl.innerHTML=`<b>${s.t}</b> · ${s.i} ${s.n}${u?` · <a href="${u}" target="_blank" rel="noopener" style="color:var(--c)">📷 fotos</a>`:''}`;nowEl.classList.add('on');}
function highlightCard(i,scroll=true){panel.querySelectorAll('.tl li').forEach(li=>li.classList.toggle('active',+li.dataset.i===i));
  const li=panel.querySelector(`.tl li[data-i="${i}"]`);if(li){const pr=panel.getBoundingClientRect(),lr=li.getBoundingClientRect();if(isMobile())panel.scrollTo({top:panel.scrollTop+lr.top-pr.top,behavior:'smooth'});else if(lr.top<pr.top+40||lr.bottom>pr.bottom-20)panel.scrollTop+=lr.top-pr.top-pr.height*0.3;}}

// ---------- PANEL ----------
let rvObs=null;
function reveal(){if(rvObs)rvObs.disconnect();const els=panel.querySelectorAll('.tl li,.wcard,.tip,.stat,.links a');
  if(!('IntersectionObserver' in window)){return;}
  rvObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rvObs.unobserve(e.target);}}),{root:panel,threshold:.08});
  els.forEach((el,k)=>{el.classList.add('rv');el.style.transitionDelay=Math.min(k,8)*40+'ms';rvObs.observe(el);});}
// ---- distancias entre puntos ----
const A29=29*Math.PI/180;
function legInfo(d,i){const s=d.stops[i];if(!s.ll)return null;let prev=null;for(let j=i-1;j>=0;j--)if(d.stops[j].ll){prev=d.stops[j].ll;break;}if(!prev)return null;
  const pts=[prev,...(s.via||[]),s.ll];const m=s.m||'walk';let grid=0,straight=0,ns=0,ew=0;
  for(let k=1;k<pts.length;k++){const a=pts[k-1],b=pts[k];const lat=(a[0]+b[0])/2*Math.PI/180;const dx=(b[1]-a[1])*Math.cos(lat)*111320,dy=(b[0]-a[0])*110540;
    const n1=Math.abs(dx*Math.sin(A29)+dy*Math.cos(A29)),e1=Math.abs(dx*Math.cos(A29)-dy*Math.sin(A29));ns+=n1;ew+=e1;grid+=n1+e1;straight+=Math.hypot(dx,dy);}
  if(grid<15&&m==='walk')return null;
  const wm=Math.min(grid,straight*1.15),r=wm/Math.max(1,grid);
  const km=straight/1000,tmin=m==='subway'?Math.round(8+km*2.2):m==='ferry'?25:m==='tram'?4:0;
  return {m,meters:m==='walk'?wm:straight,blocks:Math.max(1,Math.round((ns/80+ew/260)*r)),min:m==='walk'?Math.max(1,Math.round(wm/80)):Math.max(5,Math.round(tmin/5)*5||tmin)};}
const fmtM=x=>x<1000?(Math.round(x/10)*10)+' m':(x/1000).toFixed(1).replace('.',',')+' km';
function hopHTML(h){if(!h)return '';if(h.m==='walk')return `<li class="hop">🚶 <b>${fmtM(h.meters)}</b> · ~${h.blocks} cuadra${h.blocks>1?'s':''} · ~${h.min} min a pie</li>`;
  return `<li class="hop">${MODE[h.m].icon} <b>~${h.min} min</b> en ${MODE[h.m].name} · ${fmtM(h.meters)}${h.m==='subway'?' (incluye caminar a la estación y esperar)':''}</li>`;}
const INSIDE={'POD Times Square · ¡Sorpresa!':90,'POD Times Square · ¡Encuentro!':90,"Cena en Hell's Kitchen":90,'Almuerzo en Chelsea Market':75,'Summit One Vanderbilt':90,'Grand Central Terminal':30,'Cena en Koreatown':90,
'Brunch':60,'Museo de Historia Natural':150,'Almuerzo en el Upper West Side':60,'Merienda-cena liviana':45,'Harry Potter and the Cursed Child':210,"Porción en Joe's Pizza":20,
'Upper West Side + Levain Bakery':75,'SoHo · Greene St':45,'SoHo · Prince St y Broadway':40,'SoHo · Mercer y Spring St':30,'Nolita':25,'Chinatown · Mott St':15,'Cena con jazz en Cellar Dog':120,
'Oculus':20,"Almuerzo en Katz's Delicatessen":60,"Merienda en Juliana's":45,'Cena en Restaurant Row':90,
'Artists & Fleas':40,'Bedford Ave · vintage y cafés':30,'Almuerzo en Williamsburg':60};
const fmtHM=m=>{m=Math.round(m/5)*5;const h=Math.floor(m/60),r=m%60;return h?`${h}:${String(r).padStart(2,'0')} h`:`${r} min`;};
function dayStats(d){let wm=0,wmin=0,inside=0;d.stops.forEach((s,i)=>{const h=legInfo(d,i);if(h&&h.m==='walk'&&!s.opt){wm+=h.meters;wmin+=h.min;}if(!s.opt)inside+=INSIDE[s.n]||0;});return {km:(wm/1000).toFixed(1).replace('.',','),wmin,inside};}
const TRIP={viernes:'2026-12-18',sabado:'2026-12-19',domingo:'2026-12-20',lunes:'2026-12-21',martes:'2026-12-22',miercoles:'2026-12-23'};
function nyNow(){try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return {date:`${p.year}-${p.month}-${p.day}`,min:(+p.hour)*60+(+p.minute)};}catch(e){return {date:'',min:0};}}
function todayDay(){const n=nyNow();return DAYS.find(d=>TRIP[d.id]===n.date)||null;}
function nowIndex(d){if(!d||TRIP[d.id]!==nyNow().date)return -1;const m=nyNow().min;let k=-1;d.stops.forEach((s,i)=>{if(!s.opt&&toMin(s.t)<=m)k=i;});return k;}
function navUrl(s){if(!s.ll)return null;const mode=s.m==='subway'||s.m==='ferry'?'transit':'walking';return `https://www.google.com/maps/dir/?api=1&destination=${s.ll[0]},${s.ll[1]}&travelmode=${mode}`;}
function daysUntil(){const n=nyNow().date;if(!n)return null;return Math.round((Date.parse('2026-12-18')-Date.parse(n))/864e5);}
function renderDay(d){let n=0;const st=dayStats(d);const nowI=nowIndex(d);
 panel.innerHTML=`<div class="dayhead"><div class="dnum">${d.short}</div><div><div class="ddate">${d.date}</div><h2>${d.title}</h2></div></div>
 <div class="stats four"><div class="stat"><b>🚶 ~${st.km} km</b><span>caminata total del día</span></div><div class="stat"><b>⏱ ~${fmtHM(st.wmin)}</b><span>caminando (neto)</span></div><div class="stat"><b>🏠 ~${fmtHM(st.inside)}</b><span>adentro de lugares (sin hotel)</span></div><div class="stat"><b>💵 ${d.cost.split(' ')[0]}</b><span>p/p aprox${d.cost.includes('+')?' + compras':''}</span></div></div>
 <p class="statnote">Caminata medida entre puntos: sumen lo que paseen dentro de cada lugar (Central Park, SoHo, tiendas). "Adentro" = restaurantes, tiendas, Summit, teatro y bares, sin contar el hotel.</p>
 <div class="chips">${d.hoods.map(h=>`<span>📍 ${h}</span>`).join('')}</div>
 ${d.tip?`<div class="tip">💡 ${d.tip}</div>`:''}
 <ol class="tl">${d.stops.map((s,i)=>{const num=s.ll?++n:null;const md=s.m&&s.m!=='walk'?`<span class="mode">${MODE[s.m].icon} en ${MODE[s.m].name}</span>`:'';
  return hopHTML(legInfo(d,i))+`<li data-i="${i}" class="${s.opt?'opt':''}${i===nowI?' now':''}"><div class="badge ${num?'':'nomap'}">${num??s.i}</div><div class="body"><div class="row1"><span class="time">${s.t}</span>${i===nowI?'<span class="nowchip">● ahora</span>':''}${md}${s.opt?'<span class="mode">opcional</span>':''}</div><div class="name">${s.i} ${s.n}</div>${s.x?`<p>${s.x}</p>`:''}<div class="meta">${s.d?`<span>⏱ ${s.d}</span>`:''}${s.c?`<span>💵 ${s.c}</span>`:''}</div>${(photoUrl(s.n)||navUrl(s))?`<div class="acts">${photoUrl(s.n)?`<a class="photo" href="${photoUrl(s.n)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📷 Fotos</a>`:''}${navUrl(s)?`<a class="photo go" href="${navUrl(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🧭 Cómo llegar</a>`:''}</div>`:''}</div></li>`}).join('')}</ol>
 <div class="links"><h3>Abrir en Google Maps</h3>${d.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.l}<span>↗</span></a>`).join('')}</div>
 <div class="foot">Recorridos aproximados sobre un mapa simplificado. Costos estimados por persona. Para navegar en vivo, usen los links de Google Maps.</div>`;
 sheetBar.innerHTML=`<b class="bullet" style="--tc:${d.color}">${d.tab.split(' ')[1]}</b><div class="sb-t"><small>${d.date.split(' ')[0]}</small><span>${d.title}</span></div><button class="btn primary sb-play" aria-label="Reproducir día">▶</button><button class="btn sb-all" aria-label="Ver todo">⤢</button>`;
 sheetBar.querySelector('.sb-play').onclick=e=>{e.stopPropagation();play();};sheetBar.querySelector('.sb-all').onclick=e=>{e.stopPropagation();showAllStatic();flyTo(dayBounds(current,true),1400);};
 panel.querySelectorAll('.tl li[data-i]').forEach(li=>li.onclick=()=>activate(+li.dataset.i,false));
 panel.scrollTop=0;reveal();}
function renderWeek(){
 const chus=profile==='chus';const nHoods=new Set(DAYS.flatMap(d=>d.hoods)).size;
 panel.innerHTML=`<div class="marquee"><div>caminar · comer pizza · patinar · jazz · luces de Navidad · Central Park · SoHo · pastrami · teleférico · ${chus?'la nena y los dinos 🦕 ·':'Harry Potter ⚡ ·'} caminar un poco más ·</div></div><div class="weekwrap"><div class="sticker">¡nos<br>vamos<br>a NY!</div><h2 class="hero" style="padding-right:100px">${chus?'3 días con los Pipis en Nueva York 🎄':'5 días y medio caminando Nueva York 🎄'}</h2><p class="lead" style="padding-right:90px">${chus?'Tres rutas pensadas con la nena: paseos tranquilos, cochecito y siesta.':'Seis rutas, todo a pie y en subte.'} Tocá un día para ver la ruta animada, o arrastrá y hacé zoom en el mapa.</p></div>
 <div class="stats"><div class="stat"><b>🚶 ~${DAYS.reduce((a,d)=>a+parseFloat(dayStats(d).km.replace(',','.')),0).toFixed(0)} km</b><span>en total</span></div><div class="stat"><b>📍 ${nHoods}</b><span>barrios</span></div><div class="stat"><b>🌅 16:30</b><span>atardecer</span></div></div>
 ${(()=>{const td=todayDay(),du=daysUntil();if(td)return `<button class="todaybtn" data-id="${td.id}">📍 Hoy es ${td.tab.split(' ')[0]} ${td.tab.split(' ')[1]}: ver el plan de ahora →</button>`;if(du!==null&&du>0)return `<div class="countdown">⏳ Faltan <b>${du}</b> día${du>1?'s':''} para el viaje</div>`;return '';})()}
 <h3 class="sec" style="margin-top:8px">Los días</h3><div class="weekgrid">${DAYS.map(d=>`<div class="wcard" style="--wc:${d.color}" data-id="${d.id}"><div class="dnum">${d.short}</div><div><h4>${d.title}</h4><p>🚶 ~${dayStats(d).km} km · 🏠 ~${fmtHM(dayStats(d).inside)} adentro · ${d.hoods.slice(0,4).join(' · ')}</p></div></div>`).join('')}</div>
 <div class="tip" style="margin-top:16px">❄️ Diciembre: máximas de ~4–6 °C y noche a las 16:30. Ropa en capas, gorro, guantes y calzado impermeable.</div>
 <div class="tip">🌙 Noches: cenas entre las 20:30 y las 21 (reserven: muchas cocinas cierran a las 22–23) y planes nocturnos hasta las ~23.</div>
 ${chus?'':'<div class="tip">🛍️ Outlets: mejor en Washington desde el 26 (rebajas post-Navidad). En NY, ropa y calzado de menos de US$110 por prenda no paga impuesto.</div>'}
 <div class="tip">🚇 Subte: paguen tocando con tarjeta contactless o celular (OMNY). Después de 12 viajes en la semana, el resto sale gratis.</div>`;
 panel.querySelectorAll('.wcard').forEach(c=>c.onclick=()=>go(c.dataset.id));
 const tb=panel.querySelector('.todaybtn');if(tb)tb.onclick=()=>openToday();
 sheetBar.innerHTML=`<b class="bullet" style="--tc:#FFCE36">NY</b><div class="sb-t"><small>${profile==='chus'?'3 días':'5 días y medio'}</small><span>Toda la semana</span></div>`;panel.scrollTop=0;reveal();}
function buildWeek(){clearMap();setColor('#ffd166');
 DAYS.forEach(d=>{let prev=null;d.stops.forEach(s=>{if(!s.ll)return;if(prev&&!s.opt){const p=el('path',{d:line([prev,...(s.via||[]),s.ll]),class:'leg '+(s.m||'walk')+' dim',style:`--dc:${d.color}`},gRoutes);}prev=s.ll;});
  d.stops.forEach(s=>{if(!s.ll||s.opt)return;const g=el('g',{class:'ov-dot',style:`--dc:${d.color}`},gMarkers);el('circle',{r:5.5},g);const tt=el('title',{},g);tt.textContent=`${d.tab} · ${s.n}`;addScaled(g,s.ll);scaled[scaled.length-1].dyn=true;g.addEventListener('click',()=>{if(!moved)go(d.id)});});});
 updateScale();}

// ---------- SEARCH ----------
const norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const qEl=document.getElementById('q'),resEl=document.getElementById('res');let resItems=[],resSel=0;
function doSearch(){const q=norm(qEl.value.trim());if(q.length<2){resEl.classList.remove('on');return;}
  resItems=[];DAYS.forEach(d=>d.stops.forEach((s,i)=>{const hay=norm(s.n+' '+(s.x||'')+' '+(PH[s.n]||''));if(hay.includes(q))resItems.push({d,i,s,score:norm(s.n).includes(q)?0:1});}));
  resItems.sort((a,b)=>a.score-b.score);resItems=resItems.slice(0,10);resSel=0;
  resEl.innerHTML=resItems.length?resItems.map((r,k)=>{const [w,n]=r.d.tab.split(' ');return `<a data-k="${k}" class="${k===0?'sel':''}"><b class="bullet" style="--tc:${r.d.color}">${n}</b><span><b>${r.s.i} ${r.s.n}</b><small>${w} ${n} dic · ${r.s.t}${r.s.opt?' · opcional':''}</small></span></a>`}).join(''):'<div class="none">No está en el itinerario 🤷</div>';
  resEl.classList.add('on');resEl.querySelectorAll('a').forEach(a=>a.onclick=()=>pick(+a.dataset.k));}
const searchEl=document.getElementById('search');document.getElementById('sbtn').onclick=()=>{searchEl.classList.add('open');setTimeout(()=>qEl.focus(),50);};document.getElementById('sclose').onclick=()=>{searchEl.classList.remove('open');resEl.classList.remove('on');qEl.value='';};
function pick(k){const r=resItems[k];if(!r)return;searchEl.classList.remove('open');resEl.classList.remove('on');qEl.value='';qEl.blur();go(r.d.id,false);setTimeout(()=>activate(r.i,false),60);}
qEl.addEventListener('input',doSearch);qEl.addEventListener('focus',doSearch);
qEl.addEventListener('keydown',e=>{const as=resEl.querySelectorAll('a');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();resSel=(resSel+(e.key==='ArrowDown'?1:-1)+as.length)%Math.max(1,as.length);as.forEach((a,k)=>a.classList.toggle('sel',k===resSel));}else if(e.key==='Enter'){pick(resSel);}else if(e.key==='Escape'){resEl.classList.remove('on');qEl.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))resEl.classList.remove('on');});

// ---------- ROUTING ----------
const tabs=document.getElementById('tabs');
function buildTabs(){tabs.innerHTML=`<button class="tab" data-id="semana" style="--tc:#f7c600"><b class="bullet">NY</b>Semana</button>`+DAYS.map(d=>{const [w,n]=d.tab.split(' ');return `<button class="tab${TRIP[d.id]===nyNow().date?' today':''}" data-id="${d.id}" style="--tc:${d.color}"><b class="bullet">${n}</b>${w}${d.tab.includes('⭐')?' ⭐':''}</button>`}).join('');

function go(id,auto=true){if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);

 runId++;const d=DAYS.find(x=>x.id===id);
 document.getElementById('playBtn').style.display=d?'':'none';document.getElementById('allBtn').style.display=d?'':'none';document.getElementById('speedBtn').style.display=d?'':'none';

 current=d;curDate=TRIP[d.id]||curDate;setFX(null);applyTime(toMin(d.stops[0].t));buildDay(d);renderDay(d);hideAll();if(!auto)setSheet('peek');if(auto)play();}

// ---------- SNOW ----------
const cv=document.getElementById('snow'),cx=cv.getContext('2d');let flakes=[],snowMode='snow';
function resizeSnow(){const r=rect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
 flakes=Array.from({length:Math.round(r.width*r.height/9000)},()=>({x:Math.random()*r.width,y:Math.random()*r.height,r:.6+Math.random()*1.8,v:.25+Math.random()*.7,w:Math.random()*6.28}));}
function snow(){const r=rect();cx.clearRect(0,0,r.width,r.height);
 if(snowMode==='magic'){for(const f of flakes){f.y-=f.v*.5;f.w+=.03;f.x+=Math.sin(f.w)*.5;if(f.y<-6){f.y=r.height+4;f.x=Math.random()*r.width}const tw=.5+.5*Math.sin(f.w*3);cx.globalAlpha=.3+.7*tw;cx.fillStyle=f.r>1.6?'#fff3c4':'#ffcf5a';cx.beginPath();cx.arc(f.x,f.y,f.r*(.6+tw*.8),0,6.28);cx.fill();if(f.r>2){cx.fillRect(f.x-f.r*2.5,f.y-.4,f.r*5,.8);cx.fillRect(f.x-.4,f.y-f.r*2.5,.8,f.r*5);}}}
 else{cx.fillStyle=theme==='day'?'rgba(140,170,200,.35)':theme==='dusk'?'rgba(255,255,255,.6)':'rgba(255,255,255,.75)';
 for(const f of flakes){f.y+=f.v*.7;f.w+=.008;f.x+=Math.sin(f.w)*.3;if(f.y>r.height){f.y=-4;f.x=Math.random()*r.width}cx.beginPath();cx.globalAlpha=.35+f.r/4;cx.arc(f.x,f.y,f.r,0,6.28);cx.fill();}}
 cx.globalAlpha=1;requestAnimationFrame(snow);}
